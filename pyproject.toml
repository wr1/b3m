[project]
name = "b3m"
version = "0.1.0"
description = "modular successor to b3p"
authors = [
    { name = "wr1", email = "8971152+wr1@users.noreply.github.com" },
]
readme = "README.md"
dependencies = [
    "treeparse",
    "statesman",
    "pydantic",
    "pyyaml",
    "ccblade",
    "tomli>=2.3.0",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "loguru",
    "tomli",
    "tomli-w",
]

[project.scripts]
b3m = "b3m.cli:main"
b3m-build = "b3m.integration:main"

[tool.uv.sources.b3_geo]
path = "../b3_geo"
editable = true

[tool.uv.sources.b3_msh]
path = "../b3_msh"
editable = true

[tool.uv.sources.b3_drp]
path = "../b3_drp"
editable = true

[tool.uv.sources.b3_2d]
path = "../b3_2d"
editable = true

[tool.uv.sources.b3_bem]
path = "../b3_bem"
editable = true

[tool.uv.sources.b3_mat]
path = "../b3_mat"
editable = true

[tool.uv.sources.cgfoil]
path = "../cgfoil"
editable = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"
