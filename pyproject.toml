[project]
name = "b3m"
version = "0.1.1"
description = "modular successor to b3p"
authors = [
    { name = "wr1", email = "8971152+wr1@users.noreply.github.com" },
]
readme = "README.md"
dependencies = [
    "treeparse",
    "statesman",
    "pydantic",
    "pyyaml",
    "ccblade",
    "tomli>=2.3.0",
    "tomli-w>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "loguru",
    "tomli",
    "tomli-w",
]

[project.scripts]
b3m = "b3m.cli:main"
b3m-build = "b3m.integration:main"

[tool.uv.sources.b3_geo]
git = "https://github.com/wr1/b3_geo.git"
branch = "dev1"

[tool.uv.sources.b3_msh]
git = "https://github.com/wr1/b3_msh.git"
branch = "mul3d1"

[tool.uv.sources.b3_drp]
git = "https://github.com/wr1/b3_drp.git"
branch = "dev1"

[tool.uv.sources.b3_2d]
git = "https://github.com/wr1/b3_2d.git"
branch = "dev3"

[tool.uv.sources.b3_bem]
git = "https://github.com/wr1/b3_bem.git"
branch = "dev1"

[tool.uv.sources.b3_mat]
git = "https://github.com/wr1/b3_mat.git"
branch = "dev1"

[tool.uv.sources.cgfoil]
git = "https://github.com/wr1/cgfoil.git"
branch = "dev1"

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
